<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prontuario CCNL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a code-book style reference. Search bar on top, chapter index on the left,
   each topic shown as a block with one column per CCNL so contracts compare side by side. */
:root{
  --paper:#f4f6f7; --surface:#ffffff; --ink:#152029; --muted:#5a6672; --line:#dbe1e6; --line-strong:#c3ccd4;
  --accent:#0d5d72; --accent-ink:#ffffff; --accent-soft:#e2eff2; --mark:#fff0b8; --mark-ink:#3a2c00;
  --warn:#8f5300; --warn-bg:#fbf1df; --ok:#2b7346; --ok-bg:#e5f3ea; --danger:#a12a2a;
  --c1:#0d5d72; --c2:#6b3fa0; --c3:#a14f12; --c4:#2b7346; --c5:#8c2c48; --c6:#3a5a9b; --c7:#7a6a0e; --c8:#0f6b62; --c9:#9a3b8a; --c10:#5b5f68;
  --shadow:0 1px 2px rgba(15,35,50,.06),0 4px 14px rgba(15,35,50,.05);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1317; --surface:#151c21; --ink:#e4e9ed; --muted:#94a1ac; --line:#26313a; --line-strong:#34424d;
  --accent:#62b5c9; --accent-ink:#0b1a1f; --accent-soft:#16313a; --mark:#5c4a0c; --mark-ink:#fff3c4;
  --warn:#e6aa52; --warn-bg:#30250f; --ok:#71c493; --ok-bg:#12291b; --danger:#ef8a8a;
  --c1:#62b5c9; --c2:#b493e0; --c3:#e59a5f; --c4:#71c493; --c5:#e48aa5; --c6:#8eaaf0; --c7:#d6c35a; --c8:#5ccdbf; --c9:#df8fd2; --c10:#aab0ba;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1317; --surface:#151c21; --ink:#e4e9ed; --muted:#94a1ac; --line:#26313a; --line-strong:#34424d;
  --accent:#62b5c9; --accent-ink:#0b1a1f; --accent-soft:#16313a; --mark:#5c4a0c; --mark-ink:#fff3c4;
  --warn:#e6aa52; --warn-bg:#30250f; --ok:#71c493; --ok-bg:#12291b; --danger:#ef8a8a;
  --c1:#62b5c9; --c2:#b493e0; --c3:#e59a5f; --c4:#71c493; --c5:#e48aa5; --c6:#8eaaf0; --c7:#d6c35a; --c8:#5ccdbf; --c9:#df8fd2; --c10:#aab0ba;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:22px 60px}
@media (max-width:600px){.wrap{padding-inline:16px}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.brand h1{font-family:var(--f-display);font-weight:650;font-size:30px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;padding:5px 8px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}

/* Search */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:15px 16px 15px 46px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:17px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.hints{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:16px}
.hint{border:1px dashed var(--line-strong);background:transparent;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.hint:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:600px){.hint:nth-of-type(n+6){display:none}}

/* CCNL chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;align-items:center}
.dubbi{margin-top:6px}.dubbi summary{cursor:pointer;color:var(--warn);font-weight:600}.dubbi ul{margin:6px 0 0;padding-left:18px}.dubbi li{margin:3px 0}
.chip-hint{margin:0 0 14px;min-height:1.2em;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;font-weight:600;font-size:14px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--cc,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--cc,var(--ink));box-shadow:inset 0 0 0 1px var(--cc,var(--ink))}
.chip .n{font-weight:500;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}

/* Main layout */
.main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.index h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px;font-weight:700}
.index ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.index button{width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.index button:hover{background:var(--accent-soft)}
.index button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.index .cnt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.index-select{display:none;width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface)}
@media (max-width:900px){.index{position:static}.index ol,.index h2{display:none}.index-select{display:block}}
.ccnl-info{margin-top:22px;display:flex;flex-direction:column;gap:12px;font-size:12.5px;color:var(--muted)}
.ccnl-info .ci{border-left:3px solid var(--cc);padding-left:10px}
.ccnl-info b{color:var(--ink);font-size:13px}
@media (max-width:900px){.ccnl-info{display:none}}

/* Results */
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:13.5px}
.status strong{color:var(--ink)}
.group{margin-bottom:26px}
.group-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.group-head h3{font-family:var(--f-display);font-weight:650;font-size:20px;margin:0;text-wrap:balance;line-height:1.25}
.group-head .cap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:10px;padding:14px 16px 12px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:10px}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tagc{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cc)}
.subvoce{font-size:13px;color:var(--muted);flex-basis:100%;margin-top:-4px}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.todo{background:var(--warn-bg);color:var(--warn)}
.card-top .spacer{flex:1}
.sintesi{font-size:15.5px;line-height:1.55;margin:0}
.toggle{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:2px 0;font-size:13.5px}
.det{display:flex;flex-direction:column;gap:12px}
.det ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.det li::marker{color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--accent-soft);font-weight:600;font-size:12px;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.att{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:13.5px}
.att b{color:var(--warn)}
.foot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.art{font-family:var(--f-mono);font-size:12px;color:var(--ink)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}

.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);margin:0 0 6px;font-size:19px}
.notice{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.notice b{color:var(--warn)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,28,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 24px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:720px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.modal h2{font-family:var(--f-display);margin:0;font-size:22px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.fg{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field small{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:90px;resize:vertical;line-height:1.45}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.modal-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.modal-actions .r{display:flex;gap:8px;margin-left:auto}
.err{color:var(--danger);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.client-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:9px 14px;margin-bottom:14px;font-size:14px}
.client-banner b{font-weight:700}
/* Clients */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1 1 280px;margin:0}
.toolbar .search input{padding:11px 14px 11px 42px;font-size:15px}
.kpis{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13.5px;margin-bottom:12px}
.kpis b{color:var(--ink);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.cl{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.cl th{position:sticky;top:0;background:var(--accent-soft);text-align:left;font-size:12px;font-weight:700;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.cl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.cl tr:last-child td{border-bottom:0}
table.cl tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
table.cl .az{font-weight:600;min-width:200px}
table.cl .num{text-align:right}
.ccpill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--cc,var(--line-strong));color:var(--cc,var(--muted));white-space:nowrap}
.ccpill.none{border-style:dashed}
.ccraw{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.rowact{display:flex;gap:4px;flex-wrap:wrap}
.btn.sm{padding:4px 9px;font-size:12.5px}
/* Scadenziario */
.sc-st{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.sc-st.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.sc-st.warn{background:var(--warn-bg);color:var(--warn)}
.sc-st.ok{background:var(--ok-bg);color:var(--ok)}
.sc-st.none{border:1px dashed var(--line-strong);color:var(--muted)}
table.cl td.sc-date{white-space:nowrap;font-weight:600}
.sc-sub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.sc-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:440px}
.sc-legend{font-size:12.5px;color:var(--muted);margin:10px 0 0}
/* Calculators */
.calc-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.calc-panel{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.calc-panel{grid-template-columns:minmax(0,1fr)}}
.calc-form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.calc-form h3{font-family:var(--f-display);margin:0;font-size:19px}
.calc-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc-out{display:flex;flex-direction:column;gap:12px;min-width:0}
.big{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cc,var(--accent));border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.big .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.big .val{font-family:var(--f-display);font-size:30px;font-weight:650;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.big .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.outgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.note{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.periods{display:flex;flex-direction:column;gap:6px}
[hidden]{display:none!important}
.period{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.period select{grid-column:1 / 3}
.period-h{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;font-size:12px;color:var(--muted)}
.period input,.period select{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.meter{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--cc,var(--accent))}
.meter.over>span{background:var(--danger)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Prontuario CCNL</h1>
      <p>Le regole dei contratti collettivi usati dallo studio, voce per voce, con l'articolo di riferimento.</p>
    </div>
    <div class="top-actions" id="topActions" hidden>
      <button class="btn" id="btnNewCcnl" type="button">+ Aggiungi CCNL</button>
      <button class="btn primary" id="btnNew" type="button">+ Nuova scheda</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sezioni">
    <button class="tab" role="tab" type="button" data-view="prontuario" aria-selected="true">Prontuario</button>
    <button class="tab" role="tab" type="button" data-view="clienti" aria-selected="false">Clienti</button>
    <button class="tab" role="tab" type="button" data-view="calcolatori" aria-selected="false">Calcolatori</button>
    <button class="tab" role="tab" type="button" data-view="scadenziario" aria-selected="false">Scadenziario</button>
  </nav>

  <div id="clientBanner"></div>
  <div id="viewProntuario">
  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Cerca: malattia, preavviso, straordinario, 13ª, apprendistato…" autocomplete="off" aria-label="Cerca nel prontuario">
    <button class="btn ghost clear" id="qClear" type="button" hidden aria-label="Cancella ricerca">✕</button>
  </div>
  <div class="hints" id="hints"><span>Prova:</span></div>

  <div class="chips" id="chips" role="group" aria-label="Filtra per CCNL"></div>
  <p class="chip-hint" id="chipHint" aria-live="polite"></p>

  <div class="main">
    <aside class="index">
      <h2>Argomenti</h2>
      <ol id="chapters"></ol>
      <select class="index-select" id="chapterSelect" aria-label="Argomento"></select>
      <div class="ccnl-info" id="ccnlInfo"></div>
    </aside>
    <section aria-live="polite">
      <div id="notice"></div>
      <div class="status" id="status"></div>
      <div id="results">
        <div class="empty"><h3>Caricamento del prontuario…</h3><p>Le schede dei CCNL arrivano dal database condiviso dello studio.</p></div>
      </div>
    </section>
  </div>
  </div>
  <div id="viewClienti" hidden></div>
  <div id="viewCalcolatori" hidden></div>
  <div id="viewScadenziario" hidden></div>
</div>

<div id="modalRoot"></div>

<script>
(function(){
const CHAPTERS = ["Il contratto","3. L'assunzione","4. Le tipologie contrattuali","5. Orario di lavoro, riposi, ferie e permessi","6. La retribuzione","10. Malattia, infortunio, maternità e congedi","12. Il potere disciplinare","13. La cessazione del rapporto","Rapporti sindacali, sicurezza e tutele","Appalti e vicende d'azienda","Enti bilaterali e welfare"];
// order = chapter position, then the voce's position inside the chapter (ordine % 100)
const sortKey = s => { const ci = CHAPTERS.indexOf(s.capitolo); return (ci<0?CHAPTERS.length:ci)*1000 + ((s.ordine??99)%100); };
const COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)","var(--c8)","var(--c9)","var(--c10)"];
const HINTS = ["malattia","comporto","preavviso dimissioni","straordinario","13ª","permessi","prova","apprendistato","ferie","trasferta"];
const STOP = new Set("di del della dello dei degli delle da dal dalla la il lo le gli i e ed per in a al alla allo ai agli con come quanto quanti quanta viene vengono che cosa quando quale quali un una uno nel nella nei su sul sulla si ci mi ti è come".split(" "));
const SYN = {
  "tredicesima":["13a","13ª","tredicesima"], "13a":["tredicesima","13a"], "13":["tredicesima","13a"],
  "quattordicesima":["14a","quattordicesima"], "14a":["quattordicesima","14a"], "14":["quattordicesima","14a"],
  "rol":["rol","par","permessi"], "par":["par","rol","permessi"], "exfestivita":["ex festivita"],
  "td":["tempo determinato","td"], "termine":["tempo determinato","termine"], "pt":["part-time","part time"], "parttime":["part-time","part time"],
  "stipendio":["minimi","retribuzione","paga"], "paga":["minimi","paga","retribuzione"], "busta":["retribuzione","minimi"],
  "visita":["visita","fasce","controll"], "fiscale":["fiscale","fasce","controll"],
  "licenziamento":["licenziamento","preavviso"], "dimissioni":["dimissioni","preavviso"],
  "liquidazione":["tfr","fine rapporto"], "pagata":["trattamento","integra","indennit"], "pagato":["trattamento","integra","indennit"], "pagamento":["trattamento","integra","indennit","pagat"], "indennizzata":["trattamento","integra","indennit"], "indennizzo":["trattamento","integra","indennit"], "retribuita":["trattamento","integra","retribu"], "spetta":["spett"], "spettano":["spett"], "maternita":["maternita","gravidanza"], "lutto":["lutto","decesso"],
  "inail":["infortunio","inail"], "inps":["inps"], "notte":["notturno"], "domenica":["domenica","domenicale"],
  "trasferta":["trasferta","missione"], "missione":["missione","trasferta"], "anzianita":["anzianita","scatti"],
  "sanzioni":["disciplinare","sanzioni"], "contestazione":["disciplinare","contestazione"], "fondo":["fondo","previdenza","sanita"]
};

const $ = (s,el=document)=>el.querySelector(s);
const norm = s => String(s||"").toLowerCase().replace(/ª/g,"a").replace(/º/g,"o").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || ("voce-"+Date.now());

const state = { db:null, user:null, canWrite:false, myId:null, ccnl:{}, schede:[], loadedC:false, loadedS:false,
  q:"", filterCcnl:"tutti", chapter:"tutti", open:new Map(), names:{} };
try{ const c = localStorage.getItem("prontuario.ccnl"); if(c) state.filterCcnl = c; }catch(e){}

/* ---------- search ---------- */
function tokens(q){
  return norm(q).split(/[\s,;.]+/).filter(t=>t && !STOP.has(t)).map(t=>{
    const alts = new Set([t]);
    (SYN[t]||[]).forEach(a=>alts.add(norm(a)));
    if(t.length>=6) alts.add(t.slice(0,-1));
    return [...alts];
  });
}
function hay(s){
  const tab = s.tabella ? [ (s.tabella.intest||[]).join(" "), ...(s.tabella.righe||[]).map(r=>(r.c||[]).join(" ")) ].join(" ") : "";
  return { voce:norm(s.voce), tag:norm((s.tag||[]).join(" ")), sintesi:norm(s.sintesi), corpo:norm((s.punti||[]).join(" ")+" "+tab+" "+(s.attenzione||"")), art:norm(s.articoli), cap:norm(s.capitolo) };
}
const W = {voce:6, tag:4, sintesi:2, art:1, cap:1, corpo:1};
function score(s, toks){
  if(!toks.length) return 1;
  const h = s._h || (s._h = hay(s));
  let total = 0;
  for(const alts of toks){
    let sc = 0;
    for(const f in W){ if(alts.some(a=>h[f].includes(a))) sc += W[f]; }
    if(alts.some(a=>h.voce.startsWith(a))) sc += 4;
    if(!sc) return 0;
    total += sc;
  }
  return total;
}
let hlRe = null;
function buildHl(toks){
  const parts = [];
  toks.flat().filter(a=>a.length>=2).forEach(a=>{
    parts.push(a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/a/g,"[aàáâª]").replace(/e/g,"[eèéê]").replace(/i/g,"[iìí]").replace(/o/g,"[oòóº]").replace(/u/g,"[uùú]"));
  });
  hlRe = parts.length ? new RegExp("("+parts.sort((x,y)=>y.length-x.length).join("|")+")","gi") : null;
}
function hl(text){
  const t = esc(text);
  if(!hlRe) return t;
  return t.split(/(<[^>]*>|&[a-z#0-9]+;)/i).map(p=> /^(<|&)/.test(p)?p:p.replace(hlRe,"<mark>$1</mark>")).join("");
}

/* ---------- helpers ---------- */
function ccnlList(){ return Object.entries(state.ccnl).map(([id,m])=>({id,...m})).sort((a,b)=>(a.ordine||99)-(b.ordine||99)||a.id.localeCompare(b.id)); }
function ccColor(id){ const i = ccnlList().findIndex(c=>c.id===id); return COLORS[(i<0?5:i)%COLORS.length]; }
function selOf(){ return state.filterCcnl==="tutti" ? [] : String(state.filterCcnl).split(",").filter(Boolean); }
function ccName(id){ return state.ccnl[id]?.sigla || id; }
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; return d.toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}); }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ---------- render ---------- */
function render(){
  let toks = tokens(state.q);
  $("#qClear").hidden = !state.q;
  const list = ccnlList();
  // a word naming a CCNL ("malattia commercio") works as a CCNL filter
  let ccFromQ = null;
  toks = toks.filter(alts=>{
    const t = alts[0]; if(t.length<5) return true;
    const hit = list.find(c=>{ const sg=norm(c.sigla||c.id); return sg===t || (t.length>=6 && sg.slice(0,6)===t.slice(0,6)) || norm(c.nome).includes(t); });
    if(hit && !ccFromQ){ ccFromQ = hit.id; return false; }
    return true;
  });
  buildHl(toks);
  const ccEff = ccFromQ || state.filterCcnl;
  if(state.filterCcnl!=="tutti" && state.loadedC){ const ok=selOf().filter(id=>state.ccnl[id]); state.filterCcnl = ok.length?ok.join(","):"tutti"; }
  const sel = selOf();

  // chips
  const countBy = {}; state.schede.forEach(s=>countBy[s.ccnl]=(countBy[s.ccnl]||0)+1);
  $("#chips").innerHTML = `<button class="chip" type="button" data-cc="tutti" aria-pressed="${!ccFromQ && !sel.length}"><span class="dot" style="--cc:var(--ink)"></span>Tutti i CCNL <span class="n">${state.schede.length}</span></button>` +
    list.map(c=>`<button class="chip" type="button" data-cc="${esc(c.id)}" style="--cc:${ccColor(c.id)}" aria-pressed="${ccFromQ?ccFromQ===c.id:sel.includes(c.id)}"><span class="dot"></span>${esc(c.sigla||c.id)} <span class="n">${countBy[c.id]||0}</span></button>`).join("");

  // ccnl info
  $("#chipHint").textContent = sel.length===1 ? "Tocca un altro CCNL per confrontarli" : sel.length>1 ? `${sel.length} CCNL a confronto · tocca di nuovo per toglierne uno` : "";
  const infoIds = ccFromQ ? [ccFromQ] : sel;
  $("#ccnlInfo").innerHTML = (infoIds.length ? "" : `<div class="ci">${list.length} CCNL nel prontuario. Scegline uno o più per vedere vigenza e testo di riferimento.</div>`) + list.filter(c=>infoIds.includes(c.id)).map(c=>
    `<div class="ci" style="--cc:${ccColor(c.id)}"><b>${esc(c.sigla||c.id)}</b><br>${esc(c.nome||"")}${c.vigenza?`<br>Vigenza: ${esc(c.vigenza)}`:""}${c.testo?`<br>${esc(c.testo)}`:""}${(c.dubbi||[]).length?`<details class="dubbi"><summary>Punti da verificare (${c.dubbi.length})</summary><ul>${c.dubbi.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></details>`:""}</div>`).join("");

  // filter + score
  const inCc = state.schede.filter(s=> ccFromQ ? s.ccnl===ccFromQ : (!sel.length || sel.includes(s.ccnl)));
  const scored = new Map();
  inCc.forEach(s=>{ const sc = score(s,toks); if(sc) scored.set(s,sc); });

  // chapters with counts (after search, before chapter filter)
  const chapCount = {}; const groupsSeen = {};
  scored.forEach((sc,s)=>{ const k=s.capitolo+"|"+s.voce_id; if(!groupsSeen[k]){groupsSeen[k]=1; chapCount[s.capitolo]=(chapCount[s.capitolo]||0)+1;} });
  const allCh = [...CHAPTERS, ...[...new Set(state.schede.map(s=>s.capitolo))].filter(c=>!CHAPTERS.includes(c))];
  const totalGroups = Object.values(chapCount).reduce((a,b)=>a+b,0);
  $("#chapters").innerHTML = `<li><button type="button" data-ch="tutti" aria-current="${state.chapter==="tutti"}"><span>Tutti gli argomenti</span><span class="cnt">${totalGroups}</span></button></li>` +
    allCh.filter(c=>chapCount[c]||state.chapter===c).map(c=>`<li><button type="button" data-ch="${esc(c)}" aria-current="${state.chapter===c}"><span>${esc(c)}</span><span class="cnt">${chapCount[c]||0}</span></button></li>`).join("");
  $("#chapterSelect").innerHTML = `<option value="tutti">Tutti gli argomenti (${totalGroups})</option>` + allCh.filter(c=>chapCount[c]).map(c=>`<option value="${esc(c)}" ${state.chapter===c?"selected":""}>${esc(c)} (${chapCount[c]})</option>`).join("");

  // groups
  const groups = new Map();
  scored.forEach((sc,s)=>{
    if(state.chapter!=="tutti" && s.capitolo!==state.chapter) return;
    const k = s.voce_id;
    if(!groups.has(k)) groups.set(k,{id:k, best:0, ordine:1e9, items:[]});
    const g = groups.get(k); g.best=Math.max(g.best,sc); g.ordine=Math.min(g.ordine, sortKey(s));
  });
  // include all CCNL entries of a matched voce (comparison), within ccnl filter
  inCc.forEach(s=>{ const g=groups.get(s.voce_id); if(g && (state.chapter==="tutti"||s.capitolo===state.chapter)) g.items.push(s); });
  let arr = [...groups.values()];
  arr.sort((a,b)=> toks.length ? (b.best-a.best)||(a.ordine-b.ordine) : (a.ordine-b.ordine));
  // keep the strongest matches; voci that only mention the word in passing stay behind a button
  let weak = [];
  if(toks.length && arr.length){
    const cut = Math.max(4, arr[0].best*0.4);
    weak = arr.filter(g=>g.best<cut); arr = arr.filter(g=>g.best>=cut);
    if(state.showWeak){ arr = arr.concat(weak); weak = []; }
  }
  arr.forEach(g=>g.items.sort((a,b)=>(state.ccnl[a.ccnl]?.ordine||99)-(state.ccnl[b.ccnl]?.ordine||99)));

  const autoOpen = toks.length>0 && arr.length<=4;
  const nSchede = arr.reduce((a,g)=>a+g.items.length,0);
  $("#status").innerHTML = (state.loadedS && state.schede.length) ?
    `<span><strong>${arr.length}</strong> ${arr.length===1?"voce":"voci"} · ${nSchede} ${nSchede===1?"scheda":"schede"}${state.q?` per «${esc(state.q)}»`:""}${ccFromQ?` · solo ${esc(ccName(ccFromQ))}`:""}</span>
     <button class="btn ghost" type="button" id="btnAll">${state._allOpen?"Chiudi tutti i dettagli":"Apri tutti i dettagli"}</button>` : "";

  const res = $("#results");
  if(!state.loadedS){ return; }
  if(!state.schede.length){
    res.innerHTML = `<div class="empty"><h3>Il prontuario è vuoto</h3><p>Qui compariranno le schede dei CCNL: una per ogni voce (malattia, prova, preavviso…) e per ogni contratto.${state.canWrite?" Inizia con «Nuova scheda».":""}</p></div>`;
    return;
  }
  if(!arr.length){
    res.innerHTML = `<div class="empty"><h3>Nessuna scheda trovata</h3><p>Nessuna voce corrisponde a «${esc(state.q)}»${sel.length?` in ${esc(sel.map(ccName).join(", "))}`:""}${state.chapter!=="tutti"?` nell'argomento «${esc(state.chapter)}»`:""}. Prova una parola più generica o togli i filtri.</p></div>`;
    return;
  }
  res.innerHTML = arr.map(g=>{
    const head = g.items[0];
    return `<article class="group"><div class="group-head"><h3>${hl(head.voce)}</h3><span class="cap">${esc(head.capitolo)}</span></div>
      <div class="cols">${g.items.map(s=>card(s, head, autoOpen)).join("")}</div></article>`;
  }).join("") + (weak.length?`<div class="empty" style="padding:16px"><button class="btn" type="button" id="btnWeak">Mostra altre ${weak.length} ${weak.length===1?"voce che cita":"voci che citano"} «${esc(state.q)}» di passaggio</button></div>`:"");
  resolveNames();
}

function card(s, head, autoOpen){
  const key = s._id; const open = state.open.has(key) ? state.open.get(key) : (state._allOpen || autoOpen);
  const tab = s.tabella && (s.tabella.intest||[]).length ? `<div class="tbl"><table><thead><tr>${s.tabella.intest.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${(s.tabella.righe||[]).map(r=>`<tr>${(r.c||[]).map(c=>`<td>${hl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "";
  const by = s.aggiornatoDa ? ` da <span data-uid="${esc(s.aggiornatoDa)}">${esc(state.names[s.aggiornatoDa]||"…")}</span>` : "";
  return `<div class="card" style="--cc:${ccColor(s.ccnl)}">
    <div class="card-top"><span class="tagc">${esc(ccName(s.ccnl))}</span>
      <span class="pill ${s.verificata?"ok":"todo"}">${s.verificata?"Verificata":"Da verificare"}</span>
      <span class="spacer"></span>
      ${state.canWrite?`<button class="btn ghost" type="button" data-edit="${esc(key)}">Modifica</button>`:""}
      ${s.voce!==head.voce?`<span class="subvoce">${hl(s.voce)}</span>`:""}
    </div>
    <p class="sintesi">${hl(s.sintesi)}</p>
    ${(s.punti&&s.punti.length)||tab||s.attenzione?`<button class="toggle" type="button" data-tog="${esc(key)}" aria-expanded="${open}">${open?"Nascondi dettagli":"Dettagli e casi particolari"}</button>`:""}
    ${open?`<div class="det">${tab}${s.punti&&s.punti.length?`<ul>${s.punti.map(p=>`<li>${hl(p)}</li>`).join("")}</ul>`:""}${s.attenzione?`<div class="att"><b>Attenzione:</b> ${hl(s.attenzione)}</div>`:""}</div>`:""}
    <div class="foot"><span class="art">${hl(s.articoli||"")}</span><span>${esc(state.ccnl[s.ccnl]?.testo||"")}</span><span>Agg. ${esc(fmtDate(s.aggiornatoIl))}${by}</span></div>
  </div>`;
}

async function resolveNames(){
  if(!state.user || !state.user.profiles) return;
  const ids = [...new Set(state.schede.map(s=>s.aggiornatoDa).filter(Boolean))].filter(id=>!(id in state.names));
  if(!ids.length) return;
  try{
    const ps = await state.user.profiles(ids);
    ids.forEach(id=>{ state.names[id] = (ps && ps[id] && ps[id].name) || "un collega"; });
    document.querySelectorAll("[data-uid]").forEach(el=>{ const n=state.names[el.dataset.uid]; if(n) el.textContent=n; });
  }catch(e){}
}

/* ---------- events ---------- */
let qTimer;
$("#q").addEventListener("input", e=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ state.q=e.target.value.trim(); state.open.clear(); state.showWeak=false; render(); },120); });
$("#qClear").addEventListener("click", ()=>{ $("#q").value=""; state.q=""; render(); $("#q").focus(); });
$("#hints").insertAdjacentHTML("beforeend", HINTS.map(h=>`<button class="hint" type="button" data-hint="${esc(h)}">${esc(h)}</button>`).join(""));
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-hint],[data-cc],[data-ch],[data-tog],[data-edit],#btnAll,#btnWeak");
  if(!t) return;
  if(t.dataset.hint){ $("#q").value=t.dataset.hint; state.q=t.dataset.hint; render(); }
  else if(t.dataset.cc){ const id=t.dataset.cc; if(id==="tutti") state.filterCcnl="tutti"; else { let cur=selOf(); cur = cur.includes(id) ? cur.filter(x=>x!==id) : cur.concat(id); state.filterCcnl = cur.length?cur.join(","):"tutti"; } try{localStorage.setItem("prontuario.ccnl",state.filterCcnl)}catch(_){} render(); }
  else if(t.dataset.ch){ state.chapter=t.dataset.ch; render(); }
  else if(t.dataset.tog){ const k=t.dataset.tog; const isOpen=t.getAttribute("aria-expanded")==="true"; state.open.set(k,!isOpen); render(); }
  else if(t.dataset.edit){ const s=state.schede.find(x=>x._id===t.dataset.edit); if(s) openEditor(s); }
  else if(t.id==="btnWeak"){ state.showWeak=true; render(); }
  else if(t.id==="btnAll"){ state._allOpen=!state._allOpen; state.open.clear(); render(); }
});
$("#chapterSelect").addEventListener("change", e=>{ state.chapter=e.target.value; render(); });
$("#btnNew").addEventListener("click", ()=>openEditor(null));
$("#btnNewCcnl").addEventListener("click", openCcnlEditor);

/* ---------- editor ---------- */
function closeModal(){ $("#modalRoot").innerHTML=""; }
function modal(html){
  $("#modalRoot").innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#ov").addEventListener("mousedown", e=>{ if(e.target.id==="ov") closeModal(); });
  document.addEventListener("keydown", function k(e){ if(e.key==="Escape"){ closeModal(); document.removeEventListener("keydown",k);} });
}
function tabToText(t){ if(!t||!(t.intest||[]).length) return ""; return [t.intest.join(" | "), ...(t.righe||[]).map(r=>(r.c||[]).join(" | "))].join("\n"); }
function textToTab(txt){
  const lines = txt.split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return null;
  const cells = l=>l.split("|").map(c=>c.trim());
  return { intest: cells(lines[0]), righe: lines.slice(1).map(l=>({c:cells(l)})) };
}
function openEditor(s){
  const isNew = !s;
  const vociEsistenti = [...new Map(state.schede.map(x=>[x.voce_id,x])).values()].sort((a,b)=>sortKey(a)-sortKey(b));
  const ccOpts = ccnlList().map(c=>`<option value="${esc(c.id)}" ${(s?s.ccnl:(selOf().length===1?selOf()[0]:""))===c.id?"selected":""}>${esc(c.sigla||c.id)}</option>`).join("");
  modal(`<h2>${isNew?"Nuova scheda":"Modifica scheda"}</h2>
   <form id="fEd" class="fg" novalidate>
    <div class="field"><label for="e-ccnl">CCNL</label><select id="e-ccnl" ${isNew?"":"disabled"}>${ccOpts}</select></div>
    <div class="field"><label for="e-cap">Argomento (capitolo della Bibbia)</label><input id="e-cap" list="capList" value="${esc(s?s.capitolo:(state.chapter!=="tutti"?state.chapter:""))}"><datalist id="capList">${CHAPTERS.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
    <div class="field full"><label for="e-voce">Voce</label><input id="e-voce" list="voceList" value="${esc(s?s.voce:"")}" placeholder="Es. Malattia: comporto e aspettativa"><datalist id="voceList">${vociEsistenti.map(v=>`<option value="${esc(v.voce)}">`).join("")}</datalist>
      <small>Se scegli una voce già presente in un altro CCNL, le due schede compariranno affiancate nel confronto.</small></div>
    <div class="field full"><label for="e-sint">Risposta in sintesi</label><textarea id="e-sint" rows="3">${esc(s?s.sintesi:"")}</textarea></div>
    <div class="field full"><label for="e-punti">Dettagli e casi particolari</label><textarea id="e-punti" rows="7">${esc(s?(s.punti||[]).join("\n"):"")}</textarea><small>Un punto per riga.</small></div>
    <div class="field full"><label for="e-tab">Tabella (facoltativa)</label><textarea id="e-tab" rows="4" style="font-family:var(--f-mono);font-size:13px">${esc(s?tabToText(s.tabella):"")}</textarea><small>Prima riga = intestazioni. Separa le colonne con «|».</small></div>
    <div class="field"><label for="e-art">Articoli del CCNL</label><input id="e-art" value="${esc(s?s.articoli:"")}" placeholder="Es. Artt. 190-191"></div>
    <div class="field"><label for="e-tag">Parole chiave</label><input id="e-tag" value="${esc(s?(s.tag||[]).join(", "):"")}" placeholder="malattia, carenza, inps"></div>
    <div class="field full"><label for="e-att">Attenzione (facoltativo)</label><textarea id="e-att" rows="2">${esc(s?s.attenzione:"")}</textarea></div>
    <label class="check field full"><input type="checkbox" id="e-ver" ${s&&s.verificata?"checked":""}> Scheda verificata sul testo del CCNL</label>
    <div class="err full" id="e-err" style="grid-column:1/-1"></div>
   </form>
   <div class="modal-actions">${isNew?"":`<button class="btn danger" type="button" id="e-del">Elimina scheda</button>`}
     <div class="r"><button class="btn" type="button" id="e-cancel">Annulla</button><button class="btn primary" type="button" id="e-save">Salva</button></div></div>`);
  $("#e-cancel").onclick = closeModal;
  if(!isNew){
    const del = $("#e-del"); let armed=false;
    del.onclick = async ()=>{
      if(!armed){ armed=true; del.textContent="Conferma eliminazione"; return; }
      del.disabled=true;
      try{ await state.db.collection("schede").doc(s._id).delete(); closeModal(); toast("Scheda eliminata"); }
      catch(e){ $("#e-err").textContent = errMsg(e); del.disabled=false; }
    };
  }
  $("#e-save").onclick = async ()=>{
    const ccnl = $("#e-ccnl").value, capitolo=$("#e-cap").value.trim(), voce=$("#e-voce").value.trim(), sintesi=$("#e-sint").value.trim();
    if(!ccnl||!capitolo||!voce||!sintesi){ $("#e-err").textContent="Compila CCNL, argomento, voce e sintesi."; return; }
    let voce_id = s ? s.voce_id : null;
    if(!voce_id){ const ex = state.schede.find(x=>norm(x.voce)===norm(voce)); voce_id = ex ? ex.voce_id : slug(voce); }
    const id = s ? s._id : `${ccnl}--${voce_id}`;
    if(isNew && state.schede.some(x=>x._id===id)){ $("#e-err").textContent=`Esiste già una scheda «${voce}» per ${ccName(ccnl)}: aprila e modificala.`; return; }
    const same = state.schede.find(x=>x.voce_id===voce_id && x.ccnl!==ccnl);
    const ci = CHAPTERS.indexOf(capitolo);
    const doc = {
      ccnl, voce_id, capitolo, voce, sintesi,
      punti: $("#e-punti").value.split("\n").map(x=>x.trim()).filter(Boolean),
      articoli: $("#e-art").value.trim(), attenzione: $("#e-att").value.trim(),
      tag: $("#e-tag").value.split(",").map(x=>x.trim()).filter(Boolean),
      verificata: $("#e-ver").checked,
      ordine: s ? (s.capitolo===capitolo ? s.ordine : (ci<0?900:ci*100)+99) : (same ? same.ordine : (ci<0?900:ci*100)+99),
      origine: s ? (s.origine||"") : "Inserita dallo studio",
      aggiornatoIl: new Date().toISOString(), aggiornatoDa: state.myId || ""
    };
    const tab = textToTab($("#e-tab").value); if(tab) doc.tabella = tab;
    const btn=$("#e-save"); btn.disabled=true; btn.textContent="Salvataggio…";
    try{ await state.db.collection("schede").doc(id).set(doc); closeModal(); toast(isNew?"Scheda aggiunta":"Scheda salvata"); }
    catch(e){ $("#e-err").textContent = errMsg(e); btn.disabled=false; btn.textContent="Salva"; }
  };

    catch(e){ $("#c-err").textContent=errMsg(e); }
  };
}
function errMsg(e){
  const c = e && e.code;
  if(c==="invalid_argument"){ state.canWrite=false; $("#topActions").hidden=true; return "Non hai i permessi per modificare il prontuario. Chiedi al titolare di darti accesso come Collaboratore."; }
  if(c==="quota_exceeded") return "Il database è pieno: elimina qualche scheda e riprova.";
  if(c==="resource_exhausted") return "Troppe richieste in poco tempo: attendi qualche secondo e riprova.";
  return "Salvataggio non riuscito. Controlla la connessione e riprova.";
}

/* ---------- bridge for the Clients and Calculators module ---------- */

  setFilter(cc){ state.filterCcnl = cc; state.q=""; const q=document.getElementById("q"); if(q) q.value=""; render(); } };
const fire = ev => (window.__hooks||[]).forEach(f=>{ try{ f(ev); }catch(e){ console.error(e); } });

(async ()=>{

  }
  state.db = db; fire("db");
  db.collection("ccnl").onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); state.ccnl=m; state.loadedC=true; render(); fire("ccnl");
  }, ()=>{});
  db.collection("schede").onSnapshot(snap=>{
    state.schede = snap.docs.map(d=>({...d.data(), _id:d.id})); state.loadedS=true; render();
  }, e=>{ $("#results").innerHTML = `<div class="empty"><h3>Lettura interrotta</h3><p>Ricarica la pagina per riprendere.</p></div>`; });
  const user = window.claude.use ? await window.claude.use("user") : null;
  state.user = user;
  if(user){
    try{ state.myId = await user.id(); }catch(e){}
    let w = null; try{ w = await user.can("data.write"); }catch(e){}
    state.canWrite = (w === true) || (w === null);
  }
  $("#topActions").hidden = !state.canWrite || (window.__view && window.__view!=="prontuario");
  render(); fire("user");
})();
})();

/* ================= SCADENZIARIO ================= */
const SC = { f:"tutti", soglia:180 };
const dmy = (d,m,y) => { const x = new Date(+y, +m-1, +d); return (x.getMonth()===+m-1 && x.getDate()===+d) ? x : null; };
function scadInfo(c){
  const v = String(c.vigenza||"");
  if(c.scadenza){ const d = parseD(c.scadenza); if(d) return {d, src:"manuale"}; }
  let m = v.match(/[-–]\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m){ const all = [...v.matchAll(/(\d{1,2})\/(\d{1,2})\/(\d{4})/g)]; m = all.length>1 ? all[all.length-1] : null; }
  const d = m ? dmy(m[1],m[2],m[3]) : null;
  return {d, src: d ? "vigenza" : null};
}
function scadRows(){
  const cl = CL.list;
  return P.ccnlList().map(c=>{
    const {d, src} = scadInfo(c);
    const gg = d ? dayDiff(today, d) : null;
    const st = !d ? "none" : gg < 0 ? "bad" : gg <= SC.soglia ? "warn" : "ok";
    const clienti = cl.filter(x=>x.ccnl===c.id);
    const rinn = /rinnov/i.test(c.vigenza||"") && !c.scadenza;
    return { c, d, gg, st, src, rinn, nCl: clienti.length, nDip: clienti.reduce((a,x)=>a+(x.ti||0)+(x.td||0),0) };
  }).sort((a,b)=> (a.d?0:1)-(b.d?0:1) || (a.d&&b.d ? a.d-b.d : 0) || (a.c.ordine||99)-(b.c.ordine||99));
}
function ggTxt(gg){
  if(gg===null) return "";
  const a = Math.abs(gg);
  const t = a < 62 ? `${a} ${a===1?"giorno":"giorni"}` : (()=>{ const m = Math.round(a/30.44); return m < 24 ? `${m} mesi` : `${(a/365.25).toLocaleString("it-IT",{maximumFractionDigits:1})} anni`; })();
  return gg < 0 ? `scaduto da ${t}` : gg === 0 ? "scade oggi" : `tra ${t}`;
}
const ST_LBL = { bad:"Scaduto", warn:"In scadenza", ok:"In vigore", none:"Data non indicata" };
function renderScad(){
  const root = $("#viewScadenziario");
  if(!root.dataset.built){
    root.dataset.built = "1";
    root.innerHTML = `
      <div class="toolbar"><div><h2 style="margin:0 0 2px;font-size:20px">Scadenziario CCNL</h2>
        <p class="sc-sub" style="margin:0">Le date di scadenza sono lette dalla vigenza di ogni CCNL caricato nel prontuario. Così sai quali contratti aggiornare e quando.</p></div></div>
      <div class="chips" id="scChips" role="group" aria-label="Filtra per stato"></div>
      <div class="kpis" id="scKpi"></div>
      <div id="scBody"></div>
      <p class="sc-legend">«In scadenza» = scade entro 6 mesi. Dopo la scadenza il CCNL resta di norma applicabile fino al rinnovo (ultrattività): controlla se sono stati firmati rinnovi o nuove tabelle. Chi può modificare il prontuario può correggere la data con «Aggiorna».</p>`;
    root.addEventListener("click", e=>{
      const t = e.target.closest("[data-scf],[data-scopen],[data-scedit]"); if(!t) return;
      if(t.dataset.scf){ SC.f = t.dataset.scf; renderScad(); }
      else if(t.dataset.scopen){ P.setFilter(t.dataset.scopen); setView("prontuario"); }
      else if(t.dataset.scedit){ openScadEditor(t.dataset.scedit); }
    });
  }
  const rows = scadRows();
  const n = k => rows.filter(r=>r.st===k).length;
  const chip = (k, lbl, col) => `<button class="chip" type="button" data-scf="${k}" aria-pressed="${SC.f===k}"><span class="dot" style="--cc:${col}"></span>${lbl} <span class="n">${k==="tutti"?rows.length:n(k)}</span></button>`;
  $("#scChips").innerHTML = chip("tutti","Tutti","var(--ink)") + chip("bad","Scaduti","var(--danger)") + chip("warn","In scadenza (6 mesi)","var(--warn)") + chip("ok","In vigore","var(--ok)") + (n("none")?chip("none","Senza data","var(--muted)"):"");
  const next = rows.find(r=>r.st!=="bad" && r.d);
  $("#scKpi").innerHTML = state.loadedC ? `<span><b>${n("bad")}</b> scaduti</span><span><b>${n("warn")}</b> in scadenza entro 6 mesi</span><span><b>${n("ok")}</b> in vigore</span>${next?`<span>Prossima scadenza: <b>${esc(next.c.sigla||next.c.id)}</b> il <b>${fmtD(next.d)}</b></span>`:""}` : "";
  const body = $("#scBody");
  if(!state.loadedC){ body.innerHTML = `<div class="empty"><h3>Caricamento dei CCNL…</h3></div>`; return; }
  if(!rows.length){ body.innerHTML = `<div class="empty"><h3>Nessun CCNL caricato</h3><p>Le scadenze compariranno quando aggiungi i CCNL al prontuario.</p></div>`; return; }
  const vis = rows.filter(r=> SC.f==="tutti" || r.st===SC.f);
  if(!vis.length){ body.innerHTML = `<div class="empty"><h3>Nessun CCNL in questo stato</h3><p>Scegli un altro filtro.</p></div>`; return; }
  body.innerHTML = `<div class="tblwrap"><table class="cl"><thead><tr><th>Scadenza</th><th>Stato</th><th>CCNL</th><th>Vigenza</th><th class="num">Clienti</th><th class="num">Dipendenti</th><th></th></tr></thead><tbody>
    ${vis.map(r=>{
      const c = r.c;
      const sub = [r.rinn?"Rinnovo indicato nella vigenza: inserisci la nuova scadenza":"", c.notaScadenza?esc(c.notaScadenza):"", r.src==="manuale"?"Data inserita a mano":""].filter(Boolean).join(" · ");
      return `<tr>
        <td class="sc-date">${r.d?fmtD(r.d):"—"}<span class="sc-sub">${esc(ggTxt(r.gg))}</span></td>
        <td><span class="sc-st ${r.st}">${ST_LBL[r.st]}</span></td>
        <td><span class="ccpill" style="--cc:${P.ccColor(c.id)}">${esc(c.sigla||c.id)}</span><span class="ccraw sc-name" title="${esc(c.nome||"")}">${esc(c.nome||"")}</span></td>
        <td>${esc(c.vigenza||"—")}${c.testo?`<span class="sc-sub">${esc(c.testo)}</span>`:""}${sub?`<span class="sc-sub" style="color:var(--warn)">${sub}</span>`:""}</td>
        <td class="num">${CL.loaded?r.nCl:"…"}</td><td class="num">${CL.loaded?fmtN(r.nDip):"…"}</td>
        <td><div class="rowact"><button class="btn sm" type="button" data-scopen="${esc(c.id)}">Prontuario</button>${state.canWrite?`<button class="btn ghost sm" type="button" data-scedit="${esc(c.id)}">Aggiorna</button>`:""}</div></td></tr>`;
    }).join("")}</tbody></table></div>`;
}

function anzianitaFascia(anni){ return anni<=5?0 : anni<=10?1 : 2; }
function yearsBetween(a,b){ let y=b.getFullYear()-a.getFullYear(); const m=b.getMonth()-a.getMonth(); if(m<0||(m===0&&b.getDate()<a.getDate())) y--; return y; }
function yearsFrac(a,b){ return dayDiff(a,b)/365.25; }
const remember = {};

function renderCalc(){
  const root = $("#viewCalcolatori");
  // keep values typed so far
  root.querySelectorAll("input,select").forEach(el=>{ if(el.id) remember[el.id] = el.type==="checkbox"?el.checked:el.value; });
  let miss = "";
  if(!rulesOf(CALC.cc)){ if(state.ccnl[CALC.cc]) miss = `<p class="note">Per ${esc(P.ccName(CALC.cc))} le regole dei calcolatori non sono ancora disponibili: scegli un altro CCNL.</p>`; CALC.cc = calcIds()[0]; }
  const R = rulesOf(CALC.cc), FF = R.generic ? GFORMS : FORMS;
  const cl = activeClient && activeClient.ccnl===CALC.cc ? `<p class="note" style="border:0;padding:0;margin:0">Per il cliente <b>${esc(activeClient.azienda)}</b></p>` : "";
  root.innerHTML = `<div class="calc-nav" role="group" aria-label="Calcolatore">${TOOLS.map(([k,l])=>`<button class="chip" type="button" data-tool="${k}" aria-pressed="${CALC.tool===k}">${l}</button>`).join("")}</div>
    <div class="calc-panel" style="--cc:${P.ccColor(CALC.cc)}"><form class="calc-form" id="calcForm" novalidate>${FF[CALC.tool](R)}${cl}${miss}</form><div class="calc-out" id="calcOut" aria-live="polite"></div></div>`;
  // restore remembered values
  Object.entries(remember).forEach(([id,v])=>{ const el=document.getElementById(id); if(!el || id==="k-cc") return; if(el.type==="checkbox") el.checked=v; else if(el.tagName==="SELECT"){ if([...el.options].some(o=>o.value===v||o.text===v)) el.value=v; } else el.value=v; });
  const ccSel = $("#c-cc"); if(ccSel){ ccSel.value = CALC.cc; ccSel.onchange = ()=>{ CALC.cc = ccSel.value; Object.keys(remember).forEach(k=>{ if(/-liv$/.test(k)) delete remember[k]; }); renderCalc(); }; }
  root.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{ CALC.tool=b.dataset.tool; try{localStorage.setItem("prontuario.calc",CALC.tool)}catch(e){} renderCalc(); });
  const form = $("#calcForm");
  form.addEventListener("input", compute); form.addEventListener("change", compute);
  if(CALC.tool==="comporto") wirePeriods();
  const met = $("#f-met"); if(met) met.addEventListener("change", ()=>renderCalc());
  compute();
}

const CALCS = {
  preavviso(R){

  prova(R){

      else { const gg = parseInt(val("r-gg","6"),10); let d = new Date(ass), n=0; while(true){ const wd=d.getDay(); const lav = wd!==0 && !(gg===5 && wd===6); if(lav){ n++; if(n===p.g) break; } d=addDays(d,1); } end=d; sub = `stima su ${gg} giorni lavorativi a settimana, senza festività né assenze`; }
      return big("Durata massima", p.txt, `livello ${liv}`) + `<div class="outgrid">${big("Inizio", fmtD(ass))}${big("Fine prova (indicativa)", fmtD(end), sub)}</div>` +

    if(prec >= totDays) return big("Periodo di prova", "Non applicabile", `il lavoratore ha già svolto ${prec} giorni nelle stesse mansioni, più della prova prevista (${p.txt})`) + noteBox(`Tit. I, art. 2: assunzione entro 12 mesi dopo TD o somministrazione per le stesse mansioni. ${R.art.prova}.`);
    const end = addDays(endFull, -prec);
    return big("Durata massima", p.txt + (rid?" (ridotta)":""), `livello ${liv}${prec?` · ridotta di ${prec} giorni già lavorati`:""}`) +

      noteBox(`Se la prova è interrotta da malattia o infortunio, il lavoratore la completa se rientra entro 3 mesi. Non si può prorogare né rinnovare. ${R.art.prova}.`);
  },
  comporto(R){
    const ps = CALC.periods.map(p=>({dal:parseD(p.dal), al:parseD(p.al), tipo:p.tipo})).filter(p=>p.dal&&p.al&&p.al>=p.dal);
    if(!ps.length) return `<div class="empty">Inserisci almeno un periodo di assenza (dal / al).</div>`;
    ps.sort((a,b)=>a.dal-b.dal);
    const ref = ps.reduce((m,p)=>p.al>m?p.al:m, ps[0].al);
    const daysIn = (p, from, to) => { const a = p.dal>from?p.dal:from, b = p.al<to?p.al:to; return b>=a ? dayDiff(a,b)+1 : 0; };
    if(CALC.cc==="commercio"){
      const y0 = new Date(ref.getFullYear(),0,1), y1 = new Date(ref.getFullYear(),11,31);
      const mal = ps.filter(p=>p.tipo==="malattia").reduce((s,p)=>s+daysIn(p,y0,y1),0);
      const inf = ps.filter(p=>p.tipo==="infortunio").reduce((s,p)=>s+daysIn(p,y0,y1),0);
      const bar = (used,lim)=>`<div class="meter ${used>lim?"over":""}"><span style="width:${Math.min(100,used/lim*100)}%"></span></div>`;
      const resM = 180-mal, resI = 180-inf;
      let out = big("Malattia nell'anno "+ref.getFullYear(), `${mal} / 180 giorni`, resM>=0?`Restano ${resM} giorni. Se l'assenza prosegue senza interruzioni, il comporto si supera dopo il ${fmtD(addDays(ref,resM))}.`:`Comporto superato di ${-resM} giorni.`) + bar(mal,180);
      if(inf) out += big("Infortunio nell'anno "+ref.getFullYear(), `${inf} / 180 giorni`, resI>=0?`Restano ${resI} giorni`:`Superato di ${-resI} giorni`) + bar(inf,180);
      out += noteBox(`Prima del 180° giorno il lavoratore può chiedere con raccomandata un'aspettativa non retribuita fino a 120 giorni${val("m-grave")===true?"; con patologia grave e terapie salvavita può seguire un'ulteriore aspettativa fino a 12 mesi, e i primi 60 giorni dell'aspettativa sono pagati al 100%":""}. Part-time verticale o misto: il comporto è metà delle giornate lavorative annue. Nei TD vale fino alla scadenza del contratto. Conteggio per anno solare (1/1-31/12) in giorni di calendario. ${R.art.comporto}.`);
      return out;
    }
    const ass = parseD(val("m-ass"));
    if(!ass) return `<div class="empty">Inserisci la data di assunzione per stabilire la fascia di anzianità.</div>`;
    const from = addDays(new Date(ref.getFullYear()-3, ref.getMonth(), ref.getDate()),1);
    const mal = ps.filter(p=>p.tipo==="malattia");
    // merge contiguous episodes
    const eps=[]; mal.forEach(p=>{ const last=eps[eps.length-1]; if(last && dayDiff(last.al,p.dal)<=1){ if(p.al>last.al) last.al=p.al; } else eps.push({dal:p.dal,al:p.al}); });
    const used = eps.reduce((s,p)=>s+daysIn(p,from,ref),0);
    const anni = yearsFrac(ass, ref); const f = anni<=3?0 : anni<=6?1 : 2;
    const breve=[183,274,365][f], lungo=[274,411,548][f];
    const lunghi = eps.filter(p=>dayDiff(p.dal,p.al)+1>=91).length;
    const lastLen = eps.length ? dayDiff(eps[eps.length-1].dal, eps[eps.length-1].al)+1 : 0;
    const prol = val("m-cont")===true || lunghi>=2 || lastLen>=91;
    const lim = prol ? lungo : breve, extra = val("m-dis")===true ? [30,45,60][f] : 0;
    const res = lim + extra - used;
    let out = big("Comporto " + (prol?"prolungato":"breve"), `${used} / ${lim}${extra?` + ${extra}`:""} giorni`, res>=0?`Restano ${res} giorni. Se l'assenza prosegue, il comporto si supera dopo il ${fmtD(addDays(ref,res))}.`:`Comporto superato di ${-res} giorni.`);
    out += `<div class="meter ${res<0?"over":""}"><span style="width:${Math.min(100,used/(lim+extra)*100)}%"></span></div>`;
    out += `<div class="outgrid">${big("Anzianità", `${fmtN(anni,1)} anni`, ["fino a 3 anni","da 3 a 6 anni","oltre 6 anni"][f])}${big("Breve / prolungato", `${breve} / ${lungo}`, prol?"Applicato il prolungato":"Il prolungato non ricorre")}${big("Triennio considerato", `${fmtD(from)} – ${fmtD(ref)}`)}</div>`;
    out += noteBox(`Comporto prolungato: evento continuativo (o con un solo rientro di massimo 61 giorni), almeno 2 malattie di 91 giorni o più, oppure malattia in corso con prognosi di 91 giorni o più alla scadenza del breve. Qui è riconosciuto automaticamente se ci sono 2 episodi di almeno 91 giorni o se l'ultimo dura almeno 91 giorni. ${extra?`Disabilità certificata: ${extra} giorni in più con integrazione all'80%. `:""}Dopo il comporto il lavoratore può chiedere un'aspettativa fino a 24 mesi. Gli infortuni sul lavoro hanno una disciplina propria e non vanno inseriti. ${R.art.comporto}.`);
    return out;
  },
  malattia(R){
    const dur = Math.max(1, parseInt(val("s-dur","5"),10)||1), ev = Math.max(1, parseInt(val("s-ev","1"),10)||1), es = val("s-es")===true;
    const ret = num(val("s-ret")); const gior = ret ? ret/26 : 0;
    const days = [];
    if(CALC.cc==="commercio"){
      const app = val("s-app")===true;
      const caren = es ? 100 : [100,100,66,50,0][Math.min(ev,5)-1];
      for(let d=1; d<=Math.min(dur,180); d++){
        const inps = d<=3 ? 0 : d<=20 ? 50 : 66.66;
        let tot = app ? (d<=3 ? (ev<=6?60:0) : inps) : (d<=3 ? caren : d<=20 ? 75 : 100);
        days.push({d, inps, tot});
      }
    } else {
      const imp = val("s-qual")==="imp", f = parseInt(val("s-anz","0"),10)||0, gia = parseInt(val("s-gia","0"),10)||0;
      const soglia = [122,153,214][f];
      for(let d=1; d<=Math.min(dur,180); d++){
        const inps = imp ? 0 : (d<=3 ? 0 : d<=20 ? 50 : 66.66);
        let tot = (gia + d) <= soglia ? 100 : 80;
        if(!es && dur<=5 && ev>=4 && d<=3) tot = ev===4 ? 66 : 50;
        days.push({d, inps, tot});
      }
    }
    const rows=[]; days.forEach(x=>{ const last=rows[rows.length-1]; if(last && last.inps===x.inps && last.tot===x.tot) last.to=x.d; else rows.push({from:x.d,to:x.d,inps:x.inps,tot:x.tot}); });
    const az = r => Math.max(0, r.tot - r.inps);
    let sumI=0,sumA=0; rows.forEach(r=>{ const n=r.to-r.from+1; sumI+=n*gior*r.inps/100; sumA+=n*gior*az(r)/100; });
    let out = `<div class="tbl"><table><thead><tr><th>Giorni</th><th>Totale garantito</th><th>INPS</th><th>Azienda</th>${gior?"<th>INPS €</th><th>Azienda €</th>":""}</tr></thead><tbody>${rows.map(r=>{ const n=r.to-r.from+1; return `<tr><td>${r.from===r.to?r.from+"°":r.from+"°–"+r.to+"°"}</td><td>${fmtN(r.tot,r.tot%1?2:0)}%</td><td>${fmtN(r.inps,r.inps%1?2:0)}%</td><td>${fmtN(az(r),az(r)%1?2:0)}%</td>${gior?`<td>${fmtE(n*gior*r.inps/100)}</td><td>${fmtE(n*gior*az(r)/100)}</td>`:""}</tr>`; }).join("")}</tbody></table></div>`;
    if(gior) out = `<div class="outgrid">${big("A carico INPS (stima)", fmtE(sumI))}${big("A carico azienda (stima)", fmtE(sumA))}</div>` + out;
    else out = big("Evento di "+dur+" giorni", rows.map(r=>`${fmtN(r.tot,r.tot%1?2:0)}%`).join(" → "), "percentuale complessiva garantita per fascia di giorni") + out;
    out += noteBox(CALC.cc==="commercio"
      ? `Integrazione del datore fino al 100% nei primi 3 giorni (carenza: 1° e 2° evento al 100%, 3° al 66%, 4° al 50%, dal 5° nulla), 75% dal 4° al 20° giorno, 100% dal 21°. Il CCNL riferisce le percentuali alla retribuzione giornaliera netta: gli importi qui sono una stima sul lordo (mensile ÷ 26). Apprendisti: 60% nei primi 3 giorni (massimo 6 eventi l'anno, dopo la prova). Se l'INPS non paga, non paga nemmeno il datore. ${R.art.malattia}.`
      : `L'azienda integra fino al normale trattamento netto: 100% per i primi 122, 153 o 214 giorni secondo l'anzianità, poi 80% fino alla fine del comporto. Il conteggio riparte dopo 61 giorni di rientro. Assenze brevi (fino a 5 giorni) oltre la terza nell'anno: i primi 3 giorni al 66% (4ª) e al 50% (dalla 5ª). Gli impiegati dell'industria non hanno l'indennità INPS: paga tutto l'azienda. I ricoveri oltre 10 giorni hanno un'integrazione aggiuntiva (fino a 61 giorni). Gli importi sono stime sul lordo (mensile ÷ 26). ${R.art.malattia}.`);
    return out;
  },
  ratei(R){

    if(!dal || !al || al<dal) return `<div class="empty">Inserisci un periodo valido (dal / al).</div>`;
    const ret = num(val("t-ret"));
    const monthsIn = (from, to) => { let m=0; const list=[]; let y=from.getFullYear(), mo=from.getMonth(); while(new Date(y,mo,1)<=to){ const ms=new Date(y,mo,1), me=new Date(y,mo+1,0); const a=from>ms?from:ms, b=to<me?to:me; const gg = b>=a ? dayDiff(a,b)+1 : 0; const full = gg===me.getDate(); const ok = full || R.fraz(gg); if(ok) m++; list.push({mese:ms, gg, ok}); mo++; if(mo>11){mo=0;y++;} } return {m, list}; };
    // 13ª: calendar year of the end date

    if(app>0) start = addMonths(dec, Math.round(app*0.35)); // apprenticeship counts at 65%: shift start by the 35% not counted
    const P_=R.scatti.anni; const dates=[];
    for(let k=1;k<=R.scatti.max;k++){ const anniv = addMonths(start, 12*P_*k); const compiuto = addDays(anniv,-1); dates.push(new Date(compiuto.getFullYear(), compiuto.getMonth()+1, 1)); }
    const n = dates.filter(d=>d<=rif).length, next = dates.find(d=>d>rif);
    const imp = R.scatti.imp[liv];
    let out = big("Scatti maturati", `${n} su ${R.scatti.max}`, `livello ${liv} · ${fmtE(imp)} ciascuno`);
    out += `<div class="outgrid">${big("Importo mensile scatti", fmtE(n*imp))}${big("Prossimo scatto", next?fmtD(next):"Massimo raggiunto", next?`porterà a ${fmtE((n+1)*imp)}`:"")}</div>`;
    out += `<div class="tbl"><table><thead><tr><th>Scatto</th><th>Decorre dal</th></tr></thead><tbody>${dates.map((d,i)=>`<tr><td>${i+1}°</td><td>${fmtD(d)}${d<=rif?" ✓":""}</td></tr>`).join("")}</tbody></table></div>`;
    out += noteBox(CALC.cc==="commercio"
      ? `10 scatti triennali; ognuno decorre dal 1° del mese successivo al compimento del triennio. Al passaggio di livello gli scatti si ricalcolano sui nuovi importi. Per chi è stato assunto prima del CCNL 28/3/1987 valgono decorrenze particolari. ${R.art.scatti}.`
      : `5 scatti biennali; ognuno decorre dal 1° del mese successivo al compimento del biennio. Al passaggio di livello si conservano numero e anzianità, con il valore del nuovo livello. ${app?"Il periodo di apprendistato è stato contato al 65%. ":""}Contano anche i periodi precedenti con TD o somministrazione nelle stesse mansioni, se le interruzioni non superano 12 mesi. ${R.art.scatti}.`);
    return out;
  },
  straord(R){
    const liv = val("o-liv"), ore = num(val("o-ore","1")) || 0, i = parseInt(val("o-tipo","0"),10)||0;
    const norm_ = num(val("o-ret")) || minimoInfo(CALC.cc, liv, today).val;
    let out="";
    if(CALC.cc==="commercio"){
      const fat = num(val("o-fat")) || norm_;
      const t = STR_COM[i], qn = norm_/R.divOra, qf = fat/R.divOra;
      const magg = (t.suFatto?qf:qn)*t.m/100;
      const oraPiena = t.full ? qf + magg : null;
      out += big(t.l, `${fmtE((t.full?oraPiena:magg)*ore)}`, `${fmtN(ore,ore%1?1:0)} ${ore===1?"ora":"ore"} · maggiorazione ${fmtN(t.m,t.m%1?1:0)}%`);
      out += `<div class="outgrid">${big("Quota oraria normale", fmtE(qn), `÷ ${R.divOra}`)}${big("Quota oraria di fatto", fmtE(qf))}${big("Maggiorazione oraria", fmtE(magg), t.suFatto?"sulla quota di fatto":"sulla quota normale")}${t.full?big("Ora maggiorata", fmtE(oraPiena), "quota di fatto + maggiorazione"):""}</div>`;
      out += noteBox(`${t.full?"L'ora si paga per intero (quota oraria di fatto) più la maggiorazione.":"Le ore sono già pagate nella retribuzione mensile: si aggiunge solo la maggiorazione."} Le maggiorazioni non si cumulano tra loro. Se non indichi la retribuzione, il calcolo usa il minimo del livello (${R.minimiNota}). ${R.art.straord}.`);
    } else {
      const t = STR_MET[i], turni = val("o-turni")===true, m = t.m[turni?1:0];
      const q = norm_/R.divOra, magg = q*m/100, piena = q+magg;
      out += big(t.l, fmtE((t.full?piena:magg)*ore), `${fmtN(ore,ore%1?1:0)} ${ore===1?"ora":"ore"} · maggiorazione ${m}%${turni?" (turni)":""}`);
      out += `<div class="outgrid">${big("Retribuzione oraria", fmtE(q), `÷ ${R.divOra}`)}${big("Maggiorazione oraria", fmtE(magg))}${big("Ora maggiorata", fmtE(piena))}</div>`;
      out += noteBox(`${t.full?"Calcolato come ora intera più maggiorazione.":"Calcolata la sola maggiorazione, perché le ore sono già comprese nella retribuzione o compensate con riposo."} Per i turnisti notturni valgono 20%, 60% e 35% (25%, 65% e 40% dalle 22 alle 6 nelle aziende impiantistiche con turni sulle 24 ore). Le quote esenti oltre 40 o 48 ore annue hanno un ulteriore +8%. Se non indichi la retribuzione, il calcolo usa il minimo del livello. ${R.art.straord}.`);
    }
    return out;
  }
};


/* ================= generic calculators (rules stored in the CCNL record) ================= */
function na(R, sec){ return `<div class="empty">Per ${esc(R.nome)} questo calcolo non è disponibile: il CCNL non fissa regole nazionali utilizzabili${sec?` (${sec})`:""}. Consulta la scheda nel prontuario.</div>`; }
function gIdx(R, liv){ const i=(R.gruppi||[]).findIndex(g=>g.livelli.includes(liv)); return i<0?0:i; }
function fasciaIdx(fasce, anni){ const i=fasce.findIndex(x=>x.finoAnni==null || anni<=x.finoAnni); return i<0?fasce.length-1:i; }
function durLabel(d, lav){ if(!d) return "—"; if(d.txt) return d.txt; const p=[]; if(d.m) p.push(d.m===1?"1 mese":`${d.m} mesi`); if(d.g) p.push(`${d.g} giorni${lav?" lavorativi":""}`); return p.join(" e ") || "Nessun preavviso"; }
function countWork(from, n, sei){ let d=new Date(from), k=0; if(n<=0) return addDays(from,-1); while(true){ const wd=d.getDay(); if(wd!==0 && (sei || wd!==6)){ k++; if(k>=n) return d; } d=addDays(d,1); } }
function artTxt(o){ return o && o.art ? ` ${esc(o.art)}.` : ""; }
function notaTxt(o){ return o && o.nota ? esc(o.nota) : ""; }
const INPS_STD = d => d<=3 ? 0 : d<=20 ? 50 : d<=180 ? 66.66 : 0;

    ${fld("s-dur","Durata dell'evento (giorni)","number","5","min=1")}

};

const GCALCS = {
  preavviso(R){
    const PV=R.preavviso; if(!PV) return na(R,"preavviso");
    const liv=val("p-liv"), tipo=val("p-tipo"), ass=parseD(val("p-ass")), ces=parseD(val("p-ces"))||today;
    if(!ass) return `<div class="empty">Inserisci la data di assunzione per calcolare l'anzianità.</div>`;
    const anni=yearsFrac(ass,ces), f=fasciaIdx(PV.fasce,anni), g=gIdx(R,liv), ret=num(val("p-ret"));
    const d=((tipo==="lic"?PV.lic:PV.dim)||PV.lic)[f][g]||{};
    const lav = d.lav!=null ? d.lav : PV.lavorativi, dec = (PV.decorrenzaGruppi||[])[g] || PV.decorrenza;
    let start;
    if(dec==="1-16"){ start = ces.getDate()===1 ? ces : ces.getDate()<=16 ? new Date(ces.getFullYear(),ces.getMonth(),16) : new Date(ces.getFullYear(),ces.getMonth()+1,1); }
    else if(dec==="fine-mese"){ start = new Date(ces.getFullYear(),ces.getMonth()+1,1); }
    else start = addDays(ces,1);
    let end=null, ggCal=0;
    if(d.m||d.g){
      if(lav && d.g && !d.m){ end = countWork(start, d.g, true); }
      else { end = addDays(addDur(start,{m:d.m||0,g:d.g||0}),-1); }
      ggCal = dayDiff(start,end)+1;
    }
    const decTxt = dec==="1-16" ? "1° o 16° del mese" : dec==="fine-mese" ? "dal mese successivo" : "giorno dopo la comunicazione";
    let out = big("Preavviso", durLabel(d, lav), `${tipo==="lic"?"Licenziamento":"Dimissioni"} · livello ${esc(liv)}${(R.gruppi||[]).length>1?` (${esc(R.gruppi[g].nome)})`:""} · anzianità ${esc(PV.fasce[f].label||"")} (${fmtN(anni,1)} anni)`);
    if(end){
      out += `<div class="outgrid">${big("Decorre dal", fmtD(start), decTxt)}${big("Ultimo giorno", fmtD(end), lav&&d.g&&!d.m?"stima: 6 giorni lavorativi a settimana, senza festività":"")}</div>`;
      out += indennitaPreav(R, liv, lav&&d.g&&!d.m ? {g:ggCal} : d, ggCal, ces, tipo);
    }
    out += noteBox(`${notaTxt(PV)}${artTxt(PV)}`);
    return out;
  },
  prova(R){
    const PR=R.prova; if(!PR) return na(R,"periodo di prova");
    const liv=val("r-liv"), ass=parseD(val("r-ass")); if(!ass) return `<div class="empty">Inserisci la data di assunzione.</div>`;
    const p=PR.livelli[liv]; if(!p) return `<div class="empty">Durata non indicata per il livello ${esc(liv)}.</div>`;
    let end, sub;
    if(p.m){ end = addDays(addDur(ass,{m:p.m,g:p.g||0}),-1); sub="mesi di calendario"; }
    else if(p.effettivo){ const gg=parseInt(val("r-gg","6"),10); end = countWork(ass, p.g, gg===6); sub=`stima su ${gg} giorni lavorativi a settimana, senza festività né assenze`; }
    else { end = addDays(ass, p.g-1); sub="giorni di calendario"; }
    return big("Durata massima", esc(p.txt||durLabel(p)), `livello ${esc(liv)}`) + `<div class="outgrid">${big("Inizio", fmtD(ass))}${big("Fine prova (indicativa)", fmtD(end), sub)}</div>` + noteBox(`${notaTxt(PR)}${artTxt(PR)}`);
  },
  comporto(R){
    const C=R.comporto; if(!C) return na(R,"comporto");
    const ps = CALC.periods.map(p=>({dal:parseD(p.dal), al:parseD(p.al), tipo:p.tipo})).filter(p=>p.dal&&p.al&&p.al>=p.dal);
    if(!ps.length) return `<div class="empty">Inserisci almeno un periodo di assenza (dal / al).</div>`;
    const ref = ps.reduce((m,p)=>p.al>m?p.al:m, ps[0].al);
    let fi=0, anni=null;
    if((C.fasce||[]).length>1){ const ass=parseD(val("m-ass")); if(!ass) return `<div class="empty">Inserisci la data di assunzione: il comporto dipende dall'anzianità.</div>`; anni=yearsFrac(ass,ref); fi=fasciaIdx(C.fasce,anni); }
    const lim = C.fasce[fi].giorni;
    const mesiW = (C.fasce[fi]&&C.fasce[fi].mesi) || C.mesi || 12;
    const from = C.tipo==="anno-solare" ? new Date(ref.getFullYear(),0,1) : addDays(addMonths(ref,-mesiW),1);
    const daysIn = p => { const a=p.dal>from?p.dal:from, b=p.al<ref?p.al:ref; return b>=a ? dayDiff(a,b)+1 : 0; };
    const bar = (used,l)=>`<div class="meter ${used>l?"over":""}"><span style="width:${Math.min(100,used/l*100)}%"></span></div>`;
    const blocks = C.separaInfortunio ? [["Malattia","malattia"],["Infortunio","infortunio"]] : [["Assenze",null]];
    let out="";
    blocks.forEach(([lbl,t])=>{
      const used = ps.filter(p=>!t || p.tipo===t).reduce((s,p)=>s+daysIn(p),0);
      if(t==="infortunio" && !used) return;
      const res = lim-used;
      out += big(`${lbl} nel periodo`, `${used} / ${lim} giorni`, res>=0?`Restano ${res} giorni. Se l'assenza prosegue senza interruzioni, il comporto si supera dopo il ${fmtD(addDays(ref,res))}.`:`Comporto superato di ${-res} giorni.`) + bar(used,lim);
    });
    out += `<div class="outgrid">${big("Periodo considerato", `${fmtD(from)} – ${fmtD(ref)}`, C.tipo==="anno-solare"?"anno solare":`${mesiW} mesi a ritroso`)}${anni!=null?big("Anzianità", `${fmtN(anni,1)} anni`, `limite ${lim} giorni`):""}</div>`;
    out += noteBox(`${notaTxt(C)} Conteggio in giorni di calendario.${artTxt(C)}`);
    return out;
  },
  malattia(R){
    const M=R.malattia; if(!M) return na(R,"malattia");
    const caso = M.casi[parseInt(val("s-caso","0"),10)||0] || M.casi[0];
    const dur = Math.max(1, parseInt(val("s-dur","5"),10)||1), ret=num(val("s-ret")), gior = ret ? ret/(R.divGiorno||26) : 0;
    const maxD = Math.max(...caso.fasce.map(f=>f.al));
    const inpsOf = d => caso.inps===true ? INPS_STD(d) : Array.isArray(caso.inps) ? ((caso.inps.find(x=>d>=x.dal&&d<=x.al)||{}).perc||0) : 0;
    const days=[];
    for(let d=1; d<=Math.min(dur,maxD); d++){
      const f = caso.fasce.find(x=>d>=x.dal && d<=x.al); if(!f) continue;
      const inps = inpsOf(d); const tot = f.tot==null ? inps : f.tot;
      days.push({d, inps, tot});
    }
    if(!days.length) return `<div class="empty">Nessun trattamento previsto per questa durata.</div>`;
    const rows=[]; days.forEach(x=>{ const last=rows[rows.length-1]; if(last && last.to===x.d-1 && last.inps===x.inps && last.tot===x.tot) last.to=x.d; else rows.push({from:x.d,to:x.d,inps:x.inps,tot:x.tot}); });
    const az = r => Math.max(0, r.tot - r.inps);
    const pc = v => `${fmtN(v,v%1?2:0)}%`;
    let sumI=0,sumA=0; rows.forEach(r=>{ const n=r.to-r.from+1; sumI+=n*gior*r.inps/100; sumA+=n*gior*az(r)/100; });
    let out = `<div class="tbl"><table><thead><tr><th>Giorni</th><th>Totale garantito</th><th>INPS</th><th>Azienda</th>${gior?"<th>INPS €</th><th>Azienda €</th>":""}</tr></thead><tbody>${rows.map(r=>{ const n=r.to-r.from+1; return `<tr><td>${r.from===r.to?r.from+"°":r.from+"°–"+r.to+"°"}</td><td>${pc(r.tot)}</td><td>${pc(r.inps)}</td><td>${pc(az(r))}</td>${gior?`<td>${fmtE(n*gior*r.inps/100)}</td><td>${fmtE(n*gior*az(r)/100)}</td>`:""}</tr>`; }).join("")}</tbody></table></div>`;
    if(gior) out = `<div class="outgrid">${big("A carico INPS (stima)", fmtE(sumI))}${big("A carico azienda (stima)", fmtE(sumA))}</div>` + out;
    else out = big(`Evento di ${dur} giorni`, rows.map(r=>pc(r.tot)).join(" → "), `${esc(caso.nome)} · percentuale complessiva per fascia di giorni`) + out;
    if(dur>maxD) out += noteBox(`Il CCNL indennizza fino al ${maxD}° giorno: i giorni successivi non sono coperti da questo calcolo.`);
    out += noteBox(`${notaTxt(M)} ${caso.inps===true?"INPS calcolata con le percentuali di legge (50% dal 4° al 20° giorno, 66,66% dal 21° al 180°). ":caso.inps===false?"Nessuna indennità INPS considerata in questo caso. ":""}Gli importi sono stime sul lordo (mensile ÷ ${R.divGiorno||26}).${artTxt(M)}`);
    return out;
  },
  ratei(R){
    const dal=parseD(val("t-dal")), al=parseD(val("t-al"));
    if(!dal || !al || al<dal) return `<div class="empty">Inserisci un periodo valido (dal / al).</div>`;
    const ret=num(val("t-ret")), FZ=R.fraz||{giorni:15,op:">="};
    const quota = (gg, ms, me, a, b) => {
      if(gg===me.getDate()) return 1;
      if(FZ.soloMesiInteri) return 0;
      if(FZ.op==="26esimi"){ let n=0; for(let d=new Date(a); d<=b; d=addDays(d,1)) if(d.getDay()!==0) n++; return Math.min(26,n)/26; }
      return (FZ.op===">" ? gg>FZ.giorni : gg>=FZ.giorni) ? 1 : 0;
    };
    const monthsIn = (from, to) => { let m=0; const list=[]; let y=from.getFullYear(), mo=from.getMonth(); while(new Date(y,mo,1)<=to){ const ms=new Date(y,mo,1), me=new Date(y,mo+1,0); const a=from>ms?from:ms, b=to<me?to:me; const gg = b>=a ? dayDiff(a,b)+1 : 0; const q = gg ? quota(gg,ms,me,a,b) : 0; m+=q; list.push({mese:ms, gg, q}); mo++; if(mo>11){mo=0;y++;} } return {m, list}; };
    const agg = (R.aggiuntive||[{nome:"13ª",meseInizio:1}]);
    const qf = q => fmtN(q, q%1?2:0);
    let out = `<div class="outgrid">`; let main=null;
    agg.forEach(a=>{ const mi=(a.meseInizio||1)-1; const s = al.getMonth()>=mi ? new Date(al.getFullYear(),mi,1) : new Date(al.getFullYear()-1,mi,1); const t = monthsIn(dal>s?dal:s, al); if(!main) main=t;
      out += big(`Ratei di ${esc(a.nome)}`, `${qf(t.m)}/12`, (ret?fmtE(ret*t.m/12)+" · ":"")+(mi?`periodo da ${new Date(2000,mi,1).toLocaleDateString("it-IT",{month:"long"})}`:"anno solare")); });
    const y0=new Date(al.getFullYear(),0,1), ty=monthsIn(dal>y0?dal:y0, al);
    if(R.ferie){ const F=R.ferie; out += big("Ferie maturate", F.ore ? `${fmtN(F.ore*ty.m/12,2)} ore` : `${fmtN(F.giorni*ty.m/12,2)} giorni`, esc(F.txt||"")); }
    if((R.permessi||[]).length){ const p=R.permessi[parseInt(val("t-perm","0"),10)||0]||R.permessi[0]; out += big("Permessi maturati", `${fmtN(p.ore*ty.m/12,2)} ore`, esc(p.label)); }
    out += `</div><div class="tbl"><table><thead><tr><th>Mese</th><th>Giorni nel periodo</th><th>Rateo</th></tr></thead><tbody>${main.list.map(x=>`<tr><td>${x.mese.toLocaleDateString("it-IT",{month:"long",year:"numeric"})}</td><td>${x.gg}</td><td>${x.q===1?"Sì":x.q===0?"No":qf(x.q)}</td></tr>`).join("")}</tbody></table></div>`;
    const fr = FZ.soloMesiInteri ? "Contano solo i mesi interi." : FZ.op==="26esimi" ? "Le frazioni di mese si contano in ventiseiesimi (giorni lavorativi lunedì-sabato)." : `Una frazione di mese conta come mese intero se è di ${FZ.op===">"?"più di":"almeno"} ${FZ.giorni} giorni.`;
    out += noteBox(`${fr} Ferie e permessi sono calcolati sull'anno solare della data finale. Togli dal periodo le assenze senza retribuzione a carico del datore. ${R.ratei?notaTxt(R.ratei):""}${artTxt(R.ratei)}`);
    return out;
  },
  scatti(R){
    const S=R.scatti; if(!S) return na(R,"scatti di anzianità");

    for(let k=1;k<=max;k++){ const anniv=addMonths(dec,12*S.anni*k); if(S.decorrenza==="stesso-giorno") dates.push(anniv); else { const c=addDays(anniv,-1); dates.push(new Date(c.getFullYear(), c.getMonth()+1, 1)); } }
    const n=dates.filter(d=>d<=rif).length, next=dates.find(d=>d>rif);
    const imp = S.imp ? (S.imp[liv]||0) : S.perc ? minimoInfo(CALC.cc,liv,rif).val*S.perc/100 : 0;
    let out = big("Scatti maturati", `${n} su ${max}`, `livello ${esc(liv)} · ${fmtE(imp)} ciascuno${S.perc?` (${S.perc}% del minimo)`:""}`);
    out += `<div class="outgrid">${big("Importo mensile scatti", fmtE(n*imp))}${big("Prossimo scatto", next?fmtD(next):"Massimo raggiunto", next?`porterà a ${fmtE((n+1)*imp)}`:"")}</div>`;
    out += `<div class="tbl"><table><thead><tr><th>Scatto</th><th>Decorre dal</th></tr></thead><tbody>${dates.map((d,i)=>`<tr><td>${i+1}°</td><td>${fmtD(d)}${d<=rif?" ✓":""}</td></tr>`).join("")}</tbody></table></div>`;
    out += noteBox(`${max} scatti ${S.anni===1?"annuali":S.anni===2?"biennali":S.anni===3?"triennali":S.anni===4?"quadriennali":`ogni ${S.anni} anni`}. ${notaTxt(S)}${artTxt(S)}`);

  },
  straord(R){
